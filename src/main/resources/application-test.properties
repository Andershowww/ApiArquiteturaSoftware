spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${MSSQL_DB:ApiArquiteturaDB};encrypt=false;trustServerCertificate=true
spring.datasource.username=${MSSQL_USER:USER}
spring.datasource.password=${MSSQL_PASSWORD:SENHA}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.main.allow-bean-definition-overriding=true

# Desativa OAuth2 durante testes
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration