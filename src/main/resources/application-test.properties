spring.datasource.url=jdbc:sqlserver://sqlserver:1433;databaseName=${MSSQL_DB:ApiArquiteturaDB};encrypt=false;trustServerCertificate=true
spring.datasource.username=${MSSQL_USER:sa}
spring.datasource.password=${MSSQL_PASSWORD:Strong@Pass123}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.main.allow-bean-definition-overriding=true

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration